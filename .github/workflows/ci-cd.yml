name: Trendist Front Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Upload build to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/trendist-build"
          strip_components: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy release
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            RELEASE_PATH=/home/ubuntu/content/trendist/releases
            rm -rf $RELEASE_PATH
            mkdir -p $RELEASE_PATH
            mv /tmp/trendist-build/* $RELEASE_PATH/
            rm -rf /tmp/trendist-build
            chmod -R 755 $RELEASE_PATH
            docker exec nginx nginx -s reload
